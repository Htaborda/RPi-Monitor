name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-installer:
    name: Test install.sh (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:12-slim
          - debian:11-slim
          - ubuntu:22.04
          - ubuntu:24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Bats test suite with Docker
        env:
          BASE_IMAGE: ${{ matrix.os }}
        run: |
          ./tests/run.sh
